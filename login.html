<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0A192F]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolTutors - Sign In</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="h-full bg-[#0A192F] text-[#E6F1FF] font-sans antialiased flex flex-col justify-center items-center p-4">

  <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col space-y-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <div class="w-full max-w-md bg-[#112240] border border-[#233554] rounded-3xl shadow-2xl p-8 space-y-8">
    
    <!-- BRAND LOGO (CLICKABLE TO HOMEPAGE) -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-block group focus:outline-none">
        <img src="favicon.svg" alt="ToolTutors Icon" class="w-12 h-12 mx-auto shadow-lg rounded-2xl">
      </a>
      <div>
        <a href="index.html" class="text-2xl font-extrabold tracking-tight text-white hover:text-[#FF6B35] transition">
          Tool<span class="text-[#FF6B35]">Tutors</span>
        </a>
        <p class="text-xs text-[#8892B0]">Peer DIY Mentorship & Marketplace Hub</p>
      </div>
    </div>

    <!-- TOGGLE TABS -->
    <div class="flex bg-[#0A192F] p-1 rounded-xl border border-[#233554]">
      <button onclick="switchMode('signin')" id="tab-signin" class="flex-1 py-2 text-xs font-bold rounded-lg bg-[#233554] text-white transition">Sign In</button>
      <button onclick="switchMode('signup')" id="tab-signup" class="flex-1 py-2 text-xs font-bold rounded-lg text-[#8892B0] hover:text-white transition">Register</button>
    </div>

    <!-- FORM -->
    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
      
      <!-- Extra fields for registration -->
      <div id="signup-fields" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Full Name</label>
          <input type="text" id="full-name" placeholder="John Doe" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Select Role</label>
          <select id="user-role" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]">
            <option value="learner">Learner (Homeowner)</option>
            <option value="tutor">Tutor (DIY Mentor)</option>
          </select>
        </div>

        <div id="tutor-tier-group" class="hidden">
          <label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Tutor Experience Level</label>
          <select id="tutor-tier" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]">
            <option value="self_taught">Self-Taught Enthusiast</option>
            <option value="professional">Professional / Trade Certified</option>
          </select>
        </div>

        <div class="p-4 bg-[#0A192F] border border-[#233554] rounded-xl mt-2">
          <label class="flex items-start space-x-3 cursor-pointer">
            <input type="checkbox" id="login-terms-agreement" class="mt-1 h-4 w-4 rounded border-[#233554] text-[#FF6B35] bg-[#112240] focus:ring-[#FF6B35]">
            <div class="text-xs text-[#8892B0]">
              I agree to the <a href="terms.html" target="_blank" class="text-[#FF6B35] font-bold hover:underline">Terms of Service</a> and <a href="privacy.html" target="_blank" class="text-[#FF6B35] font-bold hover:underline">Privacy Policy</a>.
              <p id="login-tutor-commission-note" class="hidden mt-2 p-3 bg-[#FF6B35]/10 border border-[#FF6B35]/30 rounded-lg text-[#FF6B35] font-semibold leading-relaxed">
                <i class="fa-solid fa-circle-info mr-1"></i> As a Tutor, I understand and agree that ToolTutors deducts a standard 10% commission fee from all completed job payouts to cover platform maintenance, lead generation, and secure payment processing.
              </p>
            </div>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 bg-[#FF6B35] hover:bg-[#E05A2B] text-white font-bold text-sm rounded-xl transition shadow-lg mt-2">
        Sign In
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://gfygaqbxhcggnkqimzrg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VardWWRCXO6ogwO_nSd7UA_70YCwJ7j';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    // Toggle Role-based subfields and commission note during signup
    document.getElementById('user-role').addEventListener('change', (e) => {
      const tierGroup = document.getElementById('tutor-tier-group');
      const commissionNote = document.getElementById('login-tutor-commission-note');
      if (e.target.value === 'tutor') {
        tierGroup.classList.remove('hidden');
        commissionNote.classList.remove('hidden');
      } else {
        tierGroup.classList.add('hidden');
        commissionNote.classList.add('hidden');
      }
    });

    function switchMode(mode) {
      isSignUp = (mode === 'signup');
      const btn = document.getElementById('submit-btn');
      const signupFields = document.getElementById('signup-fields');
      const tabIn = document.getElementById('tab-signin');
      const tabUp = document.getElementById('tab-signup');

      if (isSignUp) {
        signupFields.classList.remove('hidden');
        btn.textContent = 'Create Account';
        tabUp.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-[#233554] text-white transition';
        tabIn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-[#8892B0] hover:text-white transition';
      } else {
        signupFields.classList.add('hidden');
        btn.textContent = 'Sign In';
        tabIn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-[#233554] text-white transition';
        tabUp.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-[#8892B0] hover:text-white transition';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...';

      try {
        if (isSignUp) {
          const fullName = document.getElementById('full-name').value.trim() || email.split('@')[0];
          const role = document.getElementById('user-role').value;
          const tutorTier = document.getElementById('tutor-tier').value;
          const termsAccepted = document.getElementById('login-terms-agreement').checked;

          if (!termsAccepted) {
            showToast('You must agree to the Terms of Service to create an account.', 'error');
            btn.disabled = false;
            btn.textContent = 'Create Account';
            return;
          }

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { 
                full_name: fullName, 
                role, 
                tutor_tier: tutorTier,
                terms_accepted: termsAccepted 
              }
            }
          });

          if (error) throw error;

          // Upsert profile record immediately
          if (data.user) {
            await supabaseClient.from('profiles').upsert({
              id: data.user.id,
              email: data.user.email,
              full_name: fullName,
              role: role,
              tutor_tier: role === 'tutor' ? tutorTier : 'self_taught',
              validation_status: role === 'tutor' ? 'pending' : 'approved'
            });
          }

          showToast('Account created successfully!', 'success');
          setTimeout(() => routeUser(data.user.id), 1000);

        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          showToast('Signed in successfully!', 'success');
          setTimeout(() => routeUser(data.user.id), 800);
        }
      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
        btn.disabled = false;
        btn.textContent = isSignUp ? 'Create Account' : 'Sign In';
      }
    }

    async function routeUser(userId) {
      // Fetch role from profiles table to determine routing destination
      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', userId).maybeSingle();
      const role = profile?.role || 'learner';

      if (role === 'admin') {
        window.location.href = 'admin.html';
      } else if (role === 'tutor') {
        window.location.href = 'tutor.html';
      } else {
        window.location.href = 'learner.html';
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `p-4 rounded-xl bg-[#112240] border ${type==='success'?'border-emerald-500/30 text-emerald-400':type==='error'?'border-rose-500/30 text-rose-400':'border-blue-500/30 text-blue-400'} text-xs font-medium shadow-2xl transition-all duration-300`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }
  </script>
</body>
</html>
