<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0A192F]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolTutors - Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };</script>
</head>
<body class="min-h-full bg-[#0A192F] text-[#E6F1FF] font-sans antialiased flex items-center justify-center p-4">
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>
  <main class="w-full max-w-md bg-[#112240] border border-[#233554] rounded-3xl shadow-2xl p-8 space-y-7">
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-block"><img src="favicon.svg" alt="ToolTutors" class="w-12 h-12 mx-auto rounded-xl shadow-lg"></a>
      <a href="index.html" class="block text-2xl font-extrabold tracking-tight text-white hover:text-[#FF6B35] transition">Tool<span class="text-[#FF6B35]">Tutors</span></a>
      <p class="text-xs text-[#8892B0]">Sign in to your workspace</p>
    </div>

    <form id="login-form" class="space-y-4" novalidate>
      <div><label for="email" class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Email address</label><input id="email" type="email" autocomplete="email" required class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm outline-none focus:border-[#FF6B35]"></div>
      <div><label for="password" class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Password</label><input id="password" type="password" autocomplete="current-password" required class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm outline-none focus:border-[#FF6B35]"></div>
      <div id="error-message" role="alert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-400"></div>
      <button id="submit-btn" type="submit" class="w-full py-3 rounded-xl bg-[#FF6B35] hover:bg-[#E05A2B] disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold text-sm transition shadow-lg">Sign In</button>
    </form>

    <div class="p-4 rounded-xl bg-[#0A192F] border border-[#233554] text-center">
      <p class="text-xs text-[#8892B0]">New to ToolTutors?</p>
      <a href="apply.html" class="inline-flex items-center gap-2 text-sm font-bold text-[#FF6B35] hover:underline mt-1">Create an account <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://gfygaqbxhcggnkqimzrg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VardWWRCXO6ogwO_nSd7UA_70YCwJ7j';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let submitting = false;

    document.getElementById('login-form').addEventListener('submit', handleLogin);

    async function handleLogin(event) {
      event.preventDefault();
      if (submitting) return;
      const form = event.currentTarget;
      if (!form.reportValidity()) return;

      const button = document.getElementById('submit-btn');
      submitting = true;
      button.disabled = true;
      button.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Signing in...';
      hideError();

      try {
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await routeUser(data.user.id);
      } catch (error) {
        showError(error.message || 'Sign in failed.');
        submitting = false;
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    }

    async function routeUser(userId) {
      const { data: profile, error } = await supabaseClient.from('profiles').select('role').eq('id', userId).maybeSingle();
      if (error) throw error;
      const role = profile?.role;
      if (role === 'admin') window.location.href = 'admin.html';
      else if (role === 'tutor') window.location.href = 'tutor.html';
      else if (role === 'learner') window.location.href = 'learner.html';
      else throw new Error('Your account profile is incomplete. Please contact ToolTutors support.');
    }

    function showError(message) { const box=document.getElementById('error-message'); box.textContent=message; box.classList.remove('hidden'); }
    function hideError() { document.getElementById('error-message').classList.add('hidden'); }
  </script>
</body>
</html>
