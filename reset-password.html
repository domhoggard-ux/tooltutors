<!DOCTYPE html><html lang="en" class="h-full bg-[#0A192F]"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ToolTutors - Reset Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script></head>
<body class="h-full bg-[#0A192F] text-[#E6F1FF] font-sans flex items-center justify-center p-4"><div id="toast-container" class="fixed bottom-4 right-4 z-50 max-w-sm w-full px-4"></div><main class="w-full max-w-md bg-[#112240] border border-[#233554] rounded-3xl shadow-2xl p-8 space-y-7"><div class="text-center space-y-2"><a href="index.html" class="inline-flex w-12 h-12 rounded-2xl bg-[#0A192F] border border-[#FF6B35]/40 items-center justify-center text-[#FF6B35] text-2xl"><i class="fa-solid fa-key"></i></a><h1 class="text-2xl font-extrabold text-white">Choose a new password</h1><p class="text-xs text-[#8892B0]">Enter a new password for your ToolTutors account.</p></div><form onsubmit="updatePassword(event)" class="space-y-4"><div><label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">New password</label><input id="new-password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]"></div><div><label class="block text-xs font-semibold text-[#8892B0] uppercase mb-1">Confirm new password</label><input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-4 py-2.5 rounded-xl bg-[#0A192F] border border-[#233554] text-white text-sm focus:outline-none focus:border-[#FF6B35]"></div><button id="update-btn" type="submit" class="w-full py-3 bg-[#FF6B35] hover:bg-[#E05A2B] text-white font-bold text-sm rounded-xl transition">Update Password</button></form><a href="login.html" class="block text-center text-xs text-[#8892B0] hover:text-white">Return to sign in</a></main>
<script>const SUPABASE_URL='https://gfygaqbxhcggnkqimzrg.supabase.co',SUPABASE_ANON_KEY='sb_publishable_VardWWRCXO6ogwO_nSd7UA_70YCwJ7j',supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function updatePassword(e){e.preventDefault();const p=document.getElementById('new-password').value,c=document.getElementById('confirm-password').value,b=document.getElementById('update-btn'),o=b.textContent;if(p.length<8){showToast('Use at least 8 characters.','error');return;}if(p!==c){showToast('The passwords do not match.','error');return;}b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>Updating…';try{const{error}=await supabaseClient.auth.updateUser({password:p});if(error)throw error;showToast('Password updated successfully. Returning to sign in…','success');await supabaseClient.auth.signOut();setTimeout(()=>window.location.href='login.html',1500);}catch(error){console.error(error);showToast('The reset link may have expired. Request a new one from the sign-in page.','error');b.disabled=false;b.textContent=o;}}function showToast(m,t){const d=document.createElement('div');d.className=`p-4 rounded-xl bg-[#112240] border ${t==='success'?'border-emerald-500/30 text-emerald-400':'border-rose-500/30 text-rose-400'} text-xs font-medium shadow-2xl`;d.textContent=m;document.getElementById('toast-container').appendChild(d);setTimeout(()=>d.remove(),5000);}</script></body></html>
