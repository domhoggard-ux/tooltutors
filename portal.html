<script>
    const SUPABASE_URL = '[https://gfygaqbxhcggnkqimzrg.supabase.co](https://gfygaqbxhcggnkqimzrg.supabase.co)';
    const SUPABASE_ANON_KEY = 'sb_publishable_VardWWRCXO6ogwO_nSd7UA_70YCwJ7j';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentProfile = null;
    let currentChatJobId = null;
    let chatPollInterval = null;

    // --- ON PAGE LOAD ---
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session }, error: sessionErr } = await supabaseClient.auth.getSession();
        if (sessionErr || !session) { window.location.href = 'login.html'; return; }

        const user = session.user;
        let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
        const meta = user.user_metadata || {};
        
        let rawRole = profile?.role || meta.role || 'learner';
        let normalizedRole = rawRole.toLowerCase() === 'homeowner' ? 'learner' : rawRole.toLowerCase();

        currentProfile = {
          id: user.id,
          email: user.email,
          full_name: profile?.full_name || meta.full_name || user.email.split('@')[0],
          role: normalizedRole,
          profile_picture_url: profile?.profile_picture_url || meta.profile_picture_url || meta.avatar_url || null,
          address_line1: profile?.address_line1 || meta.address_line1 || '',
          city: profile?.city || meta.city || '',
          postcode: profile?.postcode || meta.postcode || '',
          tutor_tier: profile?.tutor_tier || meta.tutor_tier || 'self_taught',
          validation_status: profile?.validation_status || meta.validation_status || 'pending',
          validation_notes: profile?.validation_notes || '',
          id_document_url: profile?.id_document_url || '',
          dbs_document_url: profile?.dbs_document_url || '',
          skills: profile?.skills || []
        };

        if (!profile) {
            await supabaseClient.from('profiles').upsert(currentProfile);
        }

        const loader = document.getElementById('portal-loader');
        if (loader) loader.classList.add('hidden');

        updateHeaderUI();
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));

        if (currentProfile.role === 'admin') mountAdminView();
        else if (currentProfile.role === 'tutor') mountTutorView();
        else mountLearnerView();

      } catch (err) {
        console.error(err);
        showToast('Error loading portal profile. Please refresh.', 'error');
      }
    });

    function updateHeaderUI() {
      const fullName = currentProfile.full_name;
      const userRole = currentProfile.role;
      const initials = fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      
      document.getElementById('header-user-name').textContent = fullName;
      document.getElementById('header-user-role').textContent = userRole.toUpperCase();
      document.getElementById('header-role-tag').textContent = userRole;

      const initialsContainer = document.getElementById('header-user-initials');
      if (currentProfile.profile_picture_url) {
        initialsContainer.innerHTML = `<img src="${currentProfile.profile_picture_url}" class="w-full h-full object-cover rounded-full">`;
      } else {
        initialsContainer.innerHTML = initials;
      }
    }

    async function handleGlobalAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      showToast('Uploading profile picture...', 'info');
      try {
        const ext = file.name.split('.').pop();
        const fileName = `${currentProfile.id}_avatar_${Date.now()}.${ext}`;
        await supabaseClient.storage.from('profile_pictures').upload(fileName, file);
        const { data: publicUrlData } = supabaseClient.storage.from('profile_pictures').getPublicUrl(fileName);
        const newUrl = publicUrlData.publicUrl;

        await supabaseClient.from('profiles').update({ profile_picture_url: newUrl }).eq('id', currentProfile.id);
        await supabaseClient.auth.updateUser({ data: { profile_picture_url: newUrl } });

        currentProfile.profile_picture_url = newUrl;
        updateHeaderUI();
        showToast('Profile picture updated!', 'success');
      } catch (err) {
        showToast('Failed to update picture.', 'error');
      }
    }

    // --- CHAT LOGIC ---
    function openChat(jobId, jobTitle, participantName) {
      currentChatJobId = jobId;
      document.getElementById('chat-job-title').textContent = jobTitle;
      document.getElementById('chat-participant').textContent = participantName ? `Chatting with ${participantName}` : 'Project Chat';
      document.getElementById('chat-modal').classList.remove('hidden');
      loadMessages();
      chatPollInterval = setInterval(loadMessages, 3000);
    }

    function closeChat() {
      document.getElementById('chat-modal').classList.add('hidden');
      currentChatJobId = null;
      if (chatPollInterval) clearInterval(chatPollInterval);
    }

    async function loadMessages() {
      if (!currentChatJobId) return;
      const { data, error } = await supabaseClient.from('messages').select('*').eq('job_id', currentChatJobId).order('created_at', { ascending: true });
      if (error) return;

      const container = document.getElementById('chat-messages');
      if (data.length === 0) {
        container.innerHTML = '<div class="flex-1 flex items-center justify-center"><p class="text-xs text-[#8892B0] text-center px-6">No messages yet. Use this chat to align on tools, timings, and expectations.</p></div>';
        return;
      }

      const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;

      container.innerHTML = data.map(msg => {
        const isMe = msg.sender_id === currentProfile.id;
        if (isMe) {
          return `<div class="self-end max-w-[85%] bg-[#FF6B35] text-white text-xs p-3 rounded-2xl rounded-tr-sm shadow-md">${msg.content}</div>`;
        } else {
          return `<div class="self-start max-w-[85%] bg-[#233554] text-[#E6F1FF] text-xs p-3 rounded-2xl rounded-tl-sm shadow-md border border-[#233554]">${msg.content}</div>`;
        }
      }).join('');

      if (isScrolledToBottom) container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentChatJobId) return;

      input.value = '';
      const btn = document.getElementById('chat-send-btn');
      btn.disabled = true;

      await supabaseClient.from('messages').insert([{ job_id: currentChatJobId, sender_id: currentProfile.id, content: text }]);
      btn.disabled = false;
      await loadMessages();
      document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
    }

    // --- SPRINT 8.5: ADMIN LOGIC ---
    function mountAdminView() { 
      document.getElementById('admin-view').classList.remove('hidden'); 
      switchAdminTab('reviews');
    }

    function switchAdminTab(tab) {
      document.getElementById('admin-reviews-section').classList.add('hidden');
      document.getElementById('admin-jobs-section').classList.add('hidden');
      document.getElementById('admin-users-section').classList.add('hidden');

      document.getElementById('tab-reviews').className = "pb-3 border-b-2 border-transparent text-[#8892B0] hover:text-white text-sm transition";
      document.getElementById('tab-jobs').className = "pb-3 border-b-2 border-transparent text-[#8892B0] hover:text-white text-sm transition";
      document.getElementById('tab-users').className = "pb-3 border-b-2 border-transparent text-[#8892B0] hover:text-white text-sm transition";

      document.getElementById(`admin-${tab}-section`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "pb-3 border-b-2 border-[#FF6B35] text-white font-bold text-sm transition";

      refreshAdminData(tab);
    }

    function refreshAdminData(specificTab = null) {
      const activeTab = specificTab || document.querySelector('button[id^="tab-"].border-[#FF6B35]').id.replace('tab-', '');
      if (activeTab === 'reviews') loadPendingTutors();
      if (activeTab === 'jobs') loadAllJobsAdmin();
      if (activeTab === 'users') loadAllUsersAdmin();
    }

    async function loadPendingTutors() {
      const container = document.getElementById('admin-review-list');
      container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...</p>';

      const { data: tutors, error } = await supabaseClient.from('profiles').select('*').eq('role', 'tutor').eq('validation_status', 'submitted');
      if (error) { container.innerHTML = `<p class="text-xs text-rose-400">Error: ${error.message}</p>`; return; }
      if (!tutors || tutors.length === 0) { container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-6 italic">No pending verifications at this time.</p>'; return; }

      container.innerHTML = tutors.map(t => {
        const tierClass = t.tutor_tier === 'professional' ? 'text-purple-400' : 'text-blue-400';
        return `
          <div class="bg-[#0A192F] border border-[#233554] rounded-xl p-4 flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
            <div class="flex items-center space-x-4">
              <img src="${t.profile_picture_url || '[https://via.placeholder.com/150](https://via.placeholder.com/150)'}" class="w-12 h-12 rounded-full object-cover border border-[#233554]">
              <div>
                <div class="font-bold text-white">${t.full_name || 'Tutor'}</div>
                <div class="text-[10px] text-[#8892B0] uppercase"><span class="${tierClass}">${(t.tutor_tier||'').replace('_', ' ')}</span></div>
              </div>
            </div>
            <div class="flex space-x-3">
              <button onclick="viewSecureDocument('${t.id_document_url || ''}')" class="px-3 py-1.5 bg-[#233554] hover:bg-[#FF6B35] text-white rounded text-[10px] font-bold transition">View ID</button>
              <button onclick="viewSecureDocument('${t.dbs_document_url || ''}')" class="px-3 py-1.5 bg-[#233554] hover:bg-[#FF6B35] text-white rounded text-[10px] font-bold transition">View DBS</button>
            </div>
            <div class="flex flex-col space-y-2 w-full md:w-auto">
              <input type="text" id="notes-${t.id}" placeholder="Rejection notes" class="px-3 py-1.5 rounded bg-[#112240] border border-[#233554] text-white text-[10px] focus:outline-none">
              <div class="flex space-x-2">
                <button onclick="processTutor('${t.id}', 'approved')" class="flex-1 px-3 py-1.5 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded">Approve</button>
                <button onclick="processTutor('${t.id}', 'rejected')" class="flex-1 px-3 py-1.5 bg-rose-500/20 text-rose-400 text-[10px] font-bold rounded">Reject</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadAllJobsAdmin() {
      const container = document.getElementById('admin-jobs-list');
      container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-4 col-span-full"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading all jobs...</p>';

      const { data: jobs, error } = await supabaseClient.from('job_requests').select('*, profiles!learner_id(full_name)').order('created_at', { ascending: false });
      if (error) { container.innerHTML = `<p class="text-xs text-rose-400 col-span-full">Error: ${error.message}</p>`; return; }
      if (!jobs || jobs.length === 0) { container.innerHTML = '<p class="text-xs text-[#8892B0] text-center col-span-full italic">No jobs exist on the platform.</p>'; return; }

      container.innerHTML = jobs.map(job => `
        <div class="p-4 bg-[#0A192F] border border-[#233554] rounded-xl text-xs space-y-2">
          <div class="flex justify-between items-start">
            <span class="font-bold text-white text-sm pr-2">${job.title}</span>
            <span class="px-2 py-0.5 rounded bg-[#233554] text-white uppercase text-[9px] font-bold">${job.status}</span>
          </div>
          <p class="text-[10px] text-[#8892B0]">Posted by: ${job.profiles?.full_name || 'Unknown'}</p>
          <button onclick="adminDeleteJob('${job.id}')" class="w-full mt-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold rounded-lg transition text-[10px]">
            <i class="fa-solid fa-trash mr-1"></i> Delete Job Permanently
          </button>
        </div>
      `).join('');
    }

    async function adminDeleteJob(jobId) {
      if(!confirm("Are you sure you want to permanently delete this job? This cannot be undone.")) return;
      const { error } = await supabaseClient.from('job_requests').delete().eq('id', jobId);
      if(error) showToast("Failed to delete job.", "error");
      else { showToast("Job deleted.", "success"); loadAllJobsAdmin(); }
    }

    async function loadAllUsersAdmin() {
      const container = document.getElementById('admin-users-list');
      container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading all users...</p>';

      const { data: users, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
      if (error) { container.innerHTML = `<p class="text-xs text-rose-400">Error: ${error.message}</p>`; return; }

      container.innerHTML = users.map(u => `
        <div class="bg-[#0A192F] border border-[#233554] rounded-xl p-4 flex flex-col md:flex-row gap-4 items-start justify-between">
          <div>
            <div class="font-bold text-white text-sm">${u.full_name || u.email}</div>
            <div class="text-[10px] text-[#8892B0] uppercase mt-1">Role: <span class="text-[#FF6B35] font-bold">${u.role}</span> | Tier: ${u.tutor_tier || 'N/A'}</div>
          </div>
          <div class="flex flex-col space-y-2 w-full md:w-48">
            <select id="role-select-${u.id}" class="w-full px-2 py-1.5 rounded bg-[#112240] border border-[#233554] text-white text-[10px]">
              <option value="learner" ${u.role==='learner'?'selected':''}>Learner</option>
              <option value="tutor" ${u.role==='tutor'?'selected':''}>Tutor</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
            </select>
            <button onclick="adminUpdateRole('${u.id}')" class="w-full px-3 py-1.5 bg-[#233554] hover:bg-[#FF6B35] text-white rounded text-[10px] font-bold transition">Update Role</button>
          </div>
        </div>
      `).join('');
    }

    async function adminUpdateRole(userId) {
      const newRole = document.getElementById(`role-select-${userId}`).value;
      const { error } = await supabaseClient.from('profiles').update({ role: newRole }).eq('id', userId);
      if(error) showToast("Failed to update role.", "error");
      else { showToast("User role updated.", "success"); loadAllUsersAdmin(); }
    }

    async function viewSecureDocument(path) {
      if (!path) return;
      const { data } = await supabaseClient.storage.from('tutor_documents').createSignedUrl(path, 60);
      if (data) window.open(data.signedUrl, '_blank');
    }

    async function processTutor(tutorId, newStatus) {
      const notes = document.getElementById(`notes-${tutorId}`)?.value || '';
      if (newStatus === 'rejected' && !notes.trim()) { showToast('Please provide notes when rejecting.', 'error'); return; }
      const { error } = await supabaseClient.from('profiles').update({ validation_status: newStatus, validation_notes: notes }).eq('id', tutorId);
      if (!error) { showToast(`Tutor account ${newStatus}!`, 'success'); loadPendingTutors(); }
    }

    // --- TUTOR LOGIC ---
    function mountTutorView() {
      document.getElementById('tutor-view').classList.remove('hidden');
      
      const tierBadge = document.getElementById('tutor-tier-badge');
      const tier = currentProfile?.tutor_tier || 'self_taught';

      if (tier === 'professional') {
        tierBadge.textContent = 'Professional Tier';
        tierBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20';
      } else {
        tierBadge.textContent = 'Self-Taught Tier';
        tierBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20';
      }

      const status = currentProfile?.validation_status || 'pending';
      document.getElementById('tutor-onboarding-section').classList.add('hidden');
      document.getElementById('tutor-pending-review').classList.add('hidden');
      document.getElementById('tutor-active-dashboard').classList.add('hidden');

      if (status === 'pending' || status === 'rejected') {
        document.getElementById('tutor-onboarding-section').classList.remove('hidden');
        const noteDiv = document.getElementById('tutor-rejected-note');
        if (status === 'rejected' && currentProfile?.validation_notes) {
          noteDiv.innerHTML = `<strong>Revision Required:</strong> ${currentProfile.validation_notes}`;
          noteDiv.classList.remove('hidden');
        } else {
          noteDiv.classList.add('hidden');
        }
      } else if (status === 'submitted') {
        document.getElementById('tutor-pending-review').classList.remove('hidden');
      } else if (status === 'approved') {
        document.getElementById('tutor-active-dashboard').classList.remove('hidden');
        loadTutorJobs();
      }
    }

    async function submitTutorDocuments(e) {
      e.preventDefault();
      
      const skillCheckboxes = document.querySelectorAll('#tutor-skills-container input[type="checkbox"]:checked');
      const selectedSkills = Array.from(skillCheckboxes).map(cb => cb.value);
      
      if (selectedSkills.length === 0) { showToast('Please select at least one skill.', 'error'); return; }

      const btn = document.getElementById('submit-docs-btn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Uploading...';
      btn.disabled = true;

      const profilePic = document.getElementById('tutor-profile-pic').files[0];
      const idDoc = document.getElementById('tutor-id-doc').files[0];
      const dbsDoc = document.getElementById('tutor-dbs-doc').files[0];

      try {
        let profilePicUrl = currentProfile?.profile_picture_url || null;
        let idDocPath = currentProfile?.id_document_url || null;
        let dbsDocPath = currentProfile?.dbs_document_url || null;

        if (profilePic) {
          const ext = profilePic.name.split('.').pop();
          const fileName = `${currentProfile.id}_${Date.now()}.${ext}`;
          await supabaseClient.storage.from('profile_pictures').upload(fileName, profilePic);
          const { data: publicUrlData } = supabaseClient.storage.from('profile_pictures').getPublicUrl(fileName);
          profilePicUrl = publicUrlData.publicUrl;
        }

        if (idDoc) {
          const ext = idDoc.name.split('.').pop();
          idDocPath = `${currentProfile.id}/id_${Date.now()}.${ext}`;
          await supabaseClient.storage.from('tutor_documents').upload(idDocPath, idDoc);
        }

        if (dbsDoc) {
          const ext = dbsDoc.name.split('.').pop();
          dbsDocPath = `${currentProfile.id}/dbs_${Date.now()}.${ext}`;
          await supabaseClient.storage.from('tutor_documents').upload(dbsDocPath, dbsDoc);
        }

        const updates = { validation_status: 'submitted', profile_picture_url: profilePicUrl, id_document_url: idDocPath, dbs_document_url: dbsDocPath, skills: selectedSkills };
        const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentProfile.id);
        if (error) throw error;

        showToast('Documents and skills submitted for review!', 'success');
        currentProfile = { ...currentProfile, ...updates };

        if (profilePicUrl) await supabaseClient.auth.updateUser({ data: { profile_picture_url: profilePicUrl } });

        updateHeaderUI();
        mountTutorView();
      } catch (err) {
        showToast('Upload failed. Try again.', 'error');
        console.error(err);
      } finally {
        btn.innerHTML = 'Submit Profile for Verification';
        btn.disabled = false;
      }
    }

    async function loadTutorJobs() {
      const openContainer = document.getElementById('tutor-open-jobs-list');
      const acceptedContainer = document.getElementById('tutor-accepted-jobs-list');
      
      openContainer.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...</p>';
      acceptedContainer.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...</p>';

      const { data: rawOpenJobs, error: openErr } = await supabaseClient.from('job_requests').select('*').eq('status', 'open').order('created_at', { ascending: false });
      const { data: acceptedJobs, error: accErr } = await supabaseClient.from('job_requests').select('*').eq('tutor_id', currentProfile.id).in('status', ['accepted', 'completed']).order('created_at', { ascending: false });
      const { data: myOffers } = await supabaseClient.from('job_offers').select('*').eq('tutor_id', currentProfile.id);

      const openJobs = (rawOpenJobs || []).filter(job => {
        const matchesTier = job.preferred_tier === 'any' || job.preferred_tier === currentProfile.tutor_tier;
        const matchesSkill = currentProfile.skills && currentProfile.skills.includes(job.category);
        return matchesTier && matchesSkill;
      });

      const allLearnerIds = [...new Set([...(openJobs||[]), ...(acceptedJobs||[])].map(j => j.learner_id))];
      const { data: learners } = await supabaseClient.from('profiles').select('id, full_name').in('id', allLearnerIds);
      const learnerMap = (learners || []).reduce((acc, l) => ({ ...acc, [l.id]: l.full_name }), {});

      if (openErr) {
        openContainer.innerHTML = `<p class="text-xs text-rose-400">Error: ${openErr.message}</p>`;
      } else if (!openJobs || openJobs.length === 0) {
        openContainer.innerHTML = '<p class="text-xs text-[#8892B0] text-center italic">No local jobs match your selected skills and tier right now.</p>';
      } else {
        openContainer.innerHTML = openJobs.map(job => {
          const existingBid = myOffers?.find(o => o.job_id === job.id);
          let buttonHtml = '';
          if (existingBid) {
            buttonHtml = `<button disabled class="w-full mt-3 py-2 bg-[#233554]/50 border border-[#233554] text-[#8892B0] font-bold rounded-lg text-xs cursor-not-allowed">Offer Pending: £${existingBid.offer_price}</button>`;
          } else {
            buttonHtml = `<button onclick="showOfferModal('${job.id}', '${job.title.replace(/'/g, "\\'")}')" class="w-full mt-3 py-2 bg-[#233554] hover:bg-[#FF6B35] text-white font-bold rounded-lg transition text-xs">Make Offer</button>`;
          }

          return `
          <div class="p-4 bg-[#0A192F] border border-[#233554] rounded-xl text-xs space-y-2 relative">
            <div class="flex justify-between items-start">
              <span class="font-bold text-white text-sm pr-2">${job.title}</span>
              <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 uppercase text-[9px] font-bold">New</span>
            </div>
            <p class="text-[10px] text-[#8892B0] uppercase tracking-wide font-bold"><i class="fa-solid fa-user mr-1 text-[#FF6B35]"></i> Posted by: <span class="text-white">${learnerMap[job.learner_id] || 'Learner'}</span></p>
            <hr class="border-[#233554] my-2">
            <div class="flex gap-4">
                <p class="text-[#8892B0]"><i class="fa-solid fa-tag w-4"></i> ${job.category}</p>
                <p class="text-[#8892B0]"><i class="fa-solid fa-pound-sign w-3"></i> Budget: £${job.budget_estimate || '0'}</p>
            </div>
            <p class="text-[#8892B0]"><i class="fa-solid fa-clock w-4"></i> ${job.preferred_time}</p>
            <p class="text-[#E6F1FF] mt-2 italic border-l-2 border-[#233554] pl-2">"${job.description}"</p>
            ${buttonHtml}
          </div>
        `}).join('');
      }

      if (accErr) {
        acceptedContainer.innerHTML = `<p class="text-xs text-rose-400">Error: ${accErr.message}</p>`;
      } else if (!acceptedJobs || acceptedJobs.length === 0) {
        acceptedContainer.innerHTML = '<p class="text-xs text-[#8892B0] text-center italic">You haven\'t won any bids yet.</p>';
      } else {
        acceptedContainer.innerHTML = acceptedJobs.map(job => {
          let scheduleHtml = '';
          if (job.appointment_time) {
            scheduleHtml = `<p class="text-emerald-400 font-bold mb-1"><i class="fa-solid fa-calendar-check mr-1"></i> Scheduled: ${new Date(job.appointment_time).toLocaleString()}</p>`;
          } else {
            scheduleHtml = `<p class="text-amber-500 font-bold mb-1"><i class="fa-solid fa-clock mr-1"></i> Waiting for Learner to set appointment time</p>`;
          }

          return `
          <div class="p-4 bg-[#0A192F] border border-[#FF6B35]/30 rounded-xl text-xs space-y-2">
            <div class="flex justify-between items-start">
              <span class="font-bold text-white text-sm pr-2">${job.title}</span>
              <span class="px-2 py-0.5 rounded bg-[#FF6B35]/10 text-[#FF6B35] uppercase text-[9px] font-bold">${job.status}</span>
            </div>
            <p class="text-[10px] text-[#8892B0] uppercase tracking-wide font-bold"><i class="fa-solid fa-user mr-1 text-[#FF6B35]"></i> Posted by: <span class="text-white">${learnerMap[job.learner_id] || 'Learner'}</span></p>
            <hr class="border-[#233554] my-2">
            ${scheduleHtml}
            <button onclick="openChat('${job.id}', '${job.title.replace(/'/g, "\\'")}', '${learnerMap[job.learner_id] || 'Learner'}')" class="mt-3 w-full py-2 bg-[#233554] hover:bg-[#FF6B35] text-white font-bold rounded-lg transition text-xs"><i class="fa-solid fa-comments mr-1"></i> Message Learner</button>
          </div>
        `}).join('');
      }
    }

    function showOfferModal(jobId, jobTitle) {
      document.getElementById('offer-job-id').value = jobId;
      document.getElementById('offer-job-title').textContent = jobTitle;
      document.getElementById('offer-price').value = '';
      document.getElementById('offer-message').value = '';
      document.getElementById('offer-modal').classList.remove('hidden');
    }
