<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0A192F]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolTutors - Admin Hub</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0A192F; }
    ::-webkit-scrollbar-thumb { background: #233554; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #FF6B35; }
    .tab-content { transition: opacity 0.25s ease-in-out; }
  </style>
</head>
<body class="h-full bg-[#0A192F] text-[#E6F1FF] font-sans antialiased flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-[#0A192F]/95 backdrop-blur border-b border-[#233554] px-4 py-3 sm:px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
   <div class="flex items-center space-x-3">
  <img src="logo.svg" alt="ToolTutors Logo" class="h-10 w-auto">
  <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30 uppercase tracking-wider hidden sm:inline-block">Admin Workspace</span>
</div>

      <div class="flex items-center space-x-4">
        <div class="hidden sm:block text-right">
          <div id="header-user-name" class="text-xs font-semibold text-white leading-tight">Loading...</div>
          <div class="text-[10px] text-rose-400 uppercase">Administrator</div>
        </div>
        <button onclick="handleLogout()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition duration-200">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="hidden sm:inline">Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col space-y-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- EVIDENCE REVIEW MODAL -->
  <div id="user-docs-modal" class="fixed inset-0 z-50 hidden bg-[#0A192F]/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#112240] border border-[#233554] rounded-2xl w-full max-w-sm shadow-2xl p-6 relative">
      <button onclick="document.getElementById('user-docs-modal').classList.add('hidden')" class="absolute top-4 right-4 text-[#8892B0] hover:text-[#FF6B35] text-lg transition"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-lg font-bold text-white mb-1">User Evidence</h3>
      <p class="text-xs text-[#8892B0] mb-6">Viewing documents for <span id="docs-modal-name" class="font-bold text-white"></span></p>
      <div id="docs-modal-content" class="space-y-3">
        <!-- Buttons injected here -->
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8 relative">

    <div class="bg-[#112240] p-6 rounded-2xl border border-[#233554] shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-white">Admin Management Hub</h1>
        <p class="text-xs text-[#8892B0] mt-1">Oversee platform safety, adjust tutor skills, and manage user accounts.</p>
      </div>
      <button onclick="refreshActiveTab()" class="px-4 py-2 bg-[#233554] hover:bg-[#FF6B35] text-white text-xs font-bold rounded-xl transition flex-shrink-0">
        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data
      </button>
    </div>

    <div class="bg-[#112240] rounded-2xl border border-[#233554] shadow-xl overflow-hidden">
      <!-- Admin Navigation Tabs -->
      <div class="flex border-b border-[#233554] overflow-x-auto">
        <button onclick="switchTab('reviews')" id="tab-btn-reviews" class="flex-1 py-4 px-6 text-sm font-bold bg-[#233554]/50 text-white border-b-2 border-[#FF6B35] transition whitespace-nowrap">
          <i class="fa-solid fa-id-card mr-2 text-[#FF6B35]"></i>Pending Tutors
        </button>
        <button onclick="switchTab('jobs')" id="tab-btn-jobs" class="flex-1 py-4 px-6 text-sm font-bold text-[#8892B0] hover:bg-[#233554]/30 hover:text-white border-b-2 border-transparent transition whitespace-nowrap">
          <i class="fa-solid fa-list-check mr-2"></i>All Jobs Registry
        </button>
        <button onclick="switchTab('users')" id="tab-btn-users" class="flex-1 py-4 px-6 text-sm font-bold text-[#8892B0] hover:bg-[#233554]/30 hover:text-white border-b-2 border-transparent transition whitespace-nowrap">
          <i class="fa-solid fa-users mr-2"></i>User Directory
        </button>
      </div>

      <div class="p-6 min-h-[400px]">
        
        <!-- SECTION 1: PENDING REVIEWS -->
        <div id="section-reviews" class="tab-content block space-y-4">
          <div id="admin-review-list" class="space-y-4">
            <p class="text-xs text-[#8892B0] text-center py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading pending verifications...</p>
          </div>
        </div>

        <!-- SECTION 2: ALL JOBS REGISTRY -->
        <div id="section-jobs" class="tab-content hidden space-y-4">
          <div id="admin-jobs-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <p class="text-xs text-[#8892B0] text-center py-8 col-span-full"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading job registry...</p>
          </div>
        </div>

        <!-- SECTION 3: USER DIRECTORY -->
        <div id="section-users" class="tab-content hidden space-y-4">
          <div class="flex gap-2 mb-4">
             <input type="text" id="user-search" placeholder="Search by name or email..." class="flex-1 px-4 py-2 bg-[#0A192F] border border-[#233554] rounded-xl text-white text-xs focus:outline-none focus:border-[#FF6B35]">
             <button onclick="loadAllUsers()" class="px-4 py-2 bg-[#233554] hover:bg-[#FF6B35] text-white rounded-xl transition text-xs font-bold">Search</button>
          </div>
          <div id="admin-users-list" class="space-y-4">
            <p class="text-xs text-[#8892B0] text-center py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading user directory...</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://gfygaqbxhcggnkqimzrg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VardWWRCXO6ogwO_nSd7UA_70YCwJ7j';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentAdminProfile = null;
    let currentActiveTab = 'reviews';
    let allLoadedUsers = [];
    const AVAILABLE_SKILLS = ['Plumbing', 'Tiling', 'Carpentry & Joinery', 'Electrical Basics', 'Decorating & Painting', 'Garden & Landscaping'];

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session }, error: sessionErr } = await supabaseClient.auth.getSession();
        if (sessionErr || !session) { window.location.href = 'login.html'; return; }

        const user = session.user;
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
        
        if (!profile || profile.role !== 'admin') {
          window.location.href = 'login.html';
          return;
        }

        currentAdminProfile = profile;
        document.getElementById('header-user-name').textContent = profile.full_name || user.email;
        loadPendingTutors();

      } catch (err) {
        console.error(err);
        showToast('Authentication error.', 'error');
      }
    });

    // --- UI NAVIGATION ---
    function switchTab(tabId) {
      currentActiveTab = tabId;
      ['reviews', 'jobs', 'users'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.classList.remove('bg-[#233554]/50', 'text-white', 'border-[#FF6B35]');
        btn.classList.add('text-[#8892B0]', 'border-transparent');
      });

      document.getElementById(`section-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabId}`);
      activeBtn.classList.remove('text-[#8892B0]', 'border-transparent');
      activeBtn.classList.add('bg-[#233554]/50', 'text-white', 'border-[#FF6B35]');

      refreshActiveTab();
    }

    function refreshActiveTab() {
      if (currentActiveTab === 'reviews') loadPendingTutors();
      if (currentActiveTab === 'jobs') loadAllJobs();
      if (currentActiveTab === 'users') loadAllUsers();
    }

    // --- TAB 1: PENDING TUTORS ---
    async function loadPendingTutors() {
      const container = document.getElementById('admin-review-list');
      container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Fetching documents...</p>';

      const { data: tutors, error } = await supabaseClient.from('profiles').select('*').eq('role', 'tutor').eq('validation_status', 'submitted');
      
      if (error) { container.innerHTML = `<p class="text-xs text-rose-400">Error: ${error.message}</p>`; return; }
      if (!tutors || tutors.length === 0) { container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-8 italic">Inbox zero! No pending verifications.</p>'; return; }

      container.innerHTML = tutors.map(t => `
        <div class="bg-[#0A192F] border border-[#233554] rounded-xl p-5 flex flex-col md:flex-row gap-6 items-center justify-between">
          <div class="flex items-center space-x-4 min-w-[200px]">
            <img src="${t.profile_picture_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full object-cover border border-[#233554]">
            <div>
              <div class="font-bold text-white text-sm">${t.full_name || 'Tutor'}</div>
              <div class="text-[10px] text-[#8892B0] uppercase">${(t.tutor_tier||'').replace('_',' ')}</div>
              <div class="text-[10px] text-[#8892B0] mt-1">${escapeHTML(t.phone || 'No phone synced')}</div>
              <div class="text-[10px] text-[#8892B0]">${escapeHTML([t.address_line1, t.city, t.postcode].filter(Boolean).join(', ') || 'No Stripe address synced')}</div>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            ${t.dbs_document_url ? `<button onclick="viewSecureDocument('${t.dbs_document_url}')" class="px-3 py-1.5 bg-[#233554] hover:bg-[#FF6B35] transition text-white rounded text-xs font-bold">DBS</button>` : ''}
            ${t.vat_number ? `<span class="px-3 py-1.5 bg-sky-500/10 text-sky-400 border border-sky-500/30 rounded text-xs font-bold">VAT: ${escapeHTML(t.vat_number)}</span>` : '<span class="px-3 py-1.5 bg-[#233554]/50 text-[#8892B0] rounded text-xs font-bold">No VAT number</span>'}
            ${t.stripe_onboarding_complete ? '<span class="px-3 py-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded text-xs font-bold">Stripe verified</span>' : '<span class="px-3 py-1.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded text-xs font-bold">Stripe pending</span>'}
            ${t.trade_certificate_url ? `<button onclick="viewSecureDocument('${t.trade_certificate_url}')" class="px-3 py-1.5 bg-amber-500/20 text-amber-400 hover:bg-amber-500/40 transition rounded text-xs font-bold border border-amber-500/30" title="Trade Certification">PRO</button>` : ''}
          </div>
          <div class="flex flex-col space-y-2 w-full md:w-64">
            <input type="text" id="notes-${t.id}" placeholder="Rejection notes..." class="px-3 py-1.5 rounded bg-[#112240] border border-[#233554] text-white text-xs">
            <div class="flex gap-2">
              <button onclick="processTutor('${t.id}', 'approved')" class="flex-1 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/40 transition text-emerald-400 text-xs font-bold rounded">Approve</button>
              <button onclick="processTutor('${t.id}', 'rejected')" class="flex-1 py-1.5 bg-rose-500/20 hover:bg-rose-500/40 transition text-rose-400 text-xs font-bold rounded">Reject</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function viewSecureDocument(path) {
      if (!path) { showToast('Document path is missing.', 'error'); return; }
      const { data, error } = await supabaseClient.storage.from('tutor_documents').createSignedUrl(path, 60);
      if (error) {
        showToast('Failed to generate secure document link.', 'error');
        return;
      }
      if (data) window.open(data.signedUrl, '_blank');
    }

    async function processTutor(id, status) {
      const notes = document.getElementById(`notes-${id}`)?.value || '';
      if (status === 'rejected' && !notes.trim()) { showToast('Provide rejection notes.', 'error'); return; }
      await supabaseClient.from('profiles').update({ validation_status: status, validation_notes: notes }).eq('id', id);
      showToast(`Tutor ${status}!`, 'success');
      loadPendingTutors();
    }

    // --- TAB 2: ALL JOBS ---
    async function loadAllJobs() {
      const container = document.getElementById('admin-jobs-list');
      container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-8 col-span-full">Loading registry...</p>';

      const { data: jobs } = await supabaseClient.from('job_requests').select('*, learner:profiles!learner_id(full_name), tutor:profiles!tutor_id(full_name)').order('created_at', { ascending: false });

      if (!jobs || jobs.length === 0) { container.innerHTML = '<p class="text-xs text-[#8892B0] text-center col-span-full">No jobs found.</p>'; return; }

      container.innerHTML = jobs.map(job => `
        <div class="p-4 bg-[#0A192F] border border-[#233554] rounded-xl text-xs space-y-2">
          <div class="flex justify-between font-bold text-white text-sm">
            <span>${job.title}</span>
            <span class="text-[9px] uppercase px-2 py-0.5 rounded bg-[#233554] text-[#8892B0]">${job.status}</span>
          </div>
          <p class="text-[#8892B0]">Learner: ${job.learner?.full_name || 'Unknown'} | Tutor: ${job.tutor?.full_name || 'Unassigned'}</p>
          <button onclick="adminDeleteJob('${job.id}')" class="w-full mt-2 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold rounded transition">Delete Job</button>
        </div>
      `).join('');
    }

    async function adminDeleteJob(id) {
      if(confirm('Permanently delete this job?')) {
        await supabaseClient.from('job_requests').delete().eq('id', id);
        showToast('Job deleted', 'success');
        loadAllJobs();
      }
    }

    // --- TAB 3: USER DIRECTORY (WITH SKILLS, DOCS, & DELETION) ---
    async function loadAllUsers() {
      const container = document.getElementById('admin-users-list');
      const term = document.getElementById('user-search').value.trim().toLowerCase();
      container.innerHTML = '<p class="text-xs text-[#8892B0] text-center py-8">Loading directory...</p>';

      let query = supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
      if (term) query = query.or(`full_name.ilike.%${term}%,email.ilike.%${term}%`);

      const { data: users } = await query;
      allLoadedUsers = users || []; // Store globally for modal access

      if (!users || users.length === 0) { container.innerHTML = '<p class="text-xs text-[#8892B0] text-center">No users found.</p>'; return; }

      container.innerHTML = users.map(u => {
        const userSkills = u.skills || [];
        const isTutor = u.role === 'tutor';
        const hasDocs = u.dbs_document_url || u.trade_certificate_url;

        return `
          <div class="bg-[#0A192F] border border-[#233554] rounded-xl p-4 space-y-3">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div>
                <div class="font-bold text-white text-sm flex items-center gap-2">
                  ${u.full_name || 'Unnamed'} 
                  <span class="text-[9px] px-2 py-0.5 rounded border border-[#233554] text-[#8892B0] uppercase font-bold">${u.validation_status || 'N/A'}</span>
                </div>
                <div class="text-[10px] text-[#8892B0]">${u.email}</div>
                <div class="text-[10px] uppercase font-bold text-[#FF6B35] mt-1">Role: ${u.role} | Tier: ${u.tutor_tier || 'N/A'}</div>
              </div>
              <div class="flex items-center gap-2 w-full md:w-auto">
                ${hasDocs ? `<button onclick="openUserDocsModal('${u.id}')" class="px-3 py-1.5 bg-[#233554] hover:bg-[#FF6B35] transition text-white rounded text-xs font-bold" title="View Evidence">Docs</button>` : ''}
                <select id="role-${u.id}" class="px-3 py-1.5 rounded bg-[#112240] border border-[#233554] text-white text-xs">
                  <option value="learner" ${u.role==='learner'?'selected':''}>Learner</option>
                  <option value="tutor" ${u.role==='tutor'?'selected':''}>Tutor</option>
                  <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                </select>
                <button onclick="updateUserRole('${u.id}')" class="px-3 py-1.5 bg-[#233554] hover:bg-[#FF6B35] text-white rounded text-xs font-bold transition">Update</button>
                <button onclick="deleteUser('${u.id}')" class="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/40 text-rose-400 rounded text-xs font-bold transition" title="Delete Account"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>

            ${isTutor ? `
              <div class="pt-3 border-t border-[#233554] grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 text-[10px]">
                <div class="p-2 rounded bg-[#112240] border border-[#233554]"><span class="text-[#8892B0] uppercase font-bold">Phone</span><div class="text-white mt-1">${escapeHTML(u.phone || 'Not synced')}</div></div>
                <div class="p-2 rounded bg-[#112240] border border-[#233554]"><span class="text-[#8892B0] uppercase font-bold">Location</span><div class="text-white mt-1">${escapeHTML([u.city, u.postcode].filter(Boolean).join(', ') || 'Not synced')}</div></div>
                <div class="p-2 rounded bg-[#112240] border border-[#233554]"><span class="text-[#8892B0] uppercase font-bold">VAT number</span><div class="text-white mt-1">${escapeHTML(u.vat_number || 'Not supplied')}</div></div>
                <div class="p-2 rounded bg-[#112240] border border-[#233554]"><span class="text-[#8892B0] uppercase font-bold">Stripe</span><div class="mt-1 ${u.stripe_onboarding_complete ? 'text-emerald-400' : 'text-amber-400'}">${u.stripe_onboarding_complete ? 'Verified' : 'Pending'}</div></div>
              </div>
            ` : ''}

            <!-- SKILLS EDITOR FOR TUTORS -->
            ${isTutor ? `
              <div class="pt-3 border-t border-[#233554] space-y-2">
                <p class="text-[10px] font-bold uppercase text-[#8892B0]">Certified Skills Editor:</p>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="skills-grid-${u.id}">
                  ${AVAILABLE_SKILLS.map(skill => `
                    <label class="flex items-center space-x-2 text-xs text-[#E6F1FF] cursor-pointer">
                      <input type="checkbox" value="${skill}" ${userSkills.includes(skill) ? 'checked' : ''} class="rounded text-[#FF6B35] skill-chk-${u.id}">
                      <span>${skill}</span>
                    </label>
                  `).join('')}
                </div>
                <button onclick="saveTutorSkills('${u.id}')" class="mt-2 px-3 py-1 bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-400 rounded text-[10px] font-bold transition">
                  <i class="fa-solid fa-check mr-1"></i> Save Skills
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      })[character]);
    }

    function hasUsableCoordinates(latitude, longitude) {
      if (latitude === null || latitude === undefined || latitude === '' ||
          longitude === null || longitude === undefined || longitude === '') return false;
      const lat = Number(latitude);
      const lon = Number(longitude);
      return Number.isFinite(lat) && Number.isFinite(lon) && !(lat === 0 && lon === 0);
    }

    function openUserDocsModal(userId) {
      const user = allLoadedUsers.find(u => u.id === userId);
      if (!user) return;

      document.getElementById('docs-modal-name').textContent = user.full_name || 'User';
      
      let html = `
        <div class="p-4 rounded-xl bg-[#0A192F] border border-[#233554] text-xs space-y-2 mb-4">
          <div><span class="text-[#8892B0] font-bold uppercase">Phone:</span> <span class="text-white">${escapeHTML(user.phone || 'Not synced')}</span></div>
          <div><span class="text-[#8892B0] font-bold uppercase">Address:</span> <span class="text-white">${escapeHTML([user.address_line1, user.address_line2, user.city, user.postcode, user.country].filter(Boolean).join(', ') || 'Not synced')}</span></div>
          <div><span class="text-[#8892B0] font-bold uppercase">VAT:</span> <span class="text-white">${escapeHTML(user.vat_number || 'Not supplied')}</span></div>
          <div><span class="text-[#8892B0] font-bold uppercase">Stripe payouts:</span> <span class="${user.stripe_onboarding_complete ? 'text-emerald-400' : 'text-amber-400'}">${user.stripe_onboarding_complete ? 'Verified' : 'Pending'}</span></div>
          <div><span class="text-[#8892B0] font-bold uppercase">Marketplace coordinates:</span> <span class="text-white">${hasUsableCoordinates(user.latitude, user.longitude) ? `${user.latitude}, ${user.longitude}` : 'Not available'}</span></div>
        </div>
      `;
      if (user.dbs_document_url) {
        html += `<button onclick="viewSecureDocument('${user.dbs_document_url}')" class="w-full py-3 bg-[#233554] hover:bg-[#FF6B35] transition text-white font-bold text-sm rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-shield-halved"></i> View DBS Certificate</button>`;
      }
      if (user.trade_certificate_url) {
        html += `<button onclick="viewSecureDocument('${user.trade_certificate_url}')" class="w-full py-3 bg-amber-500/20 hover:bg-amber-500/40 transition text-amber-400 font-bold text-sm border border-amber-500/30 rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-medal"></i> View Pro Certificate</button>`;
      }

      if (!user.dbs_document_url && !user.trade_certificate_url) {
        html += '<p class="text-xs text-[#8892B0] text-center italic py-4">No evidence documents found for this user.</p>';
      }

      document.getElementById('docs-modal-content').innerHTML = html;
      document.getElementById('user-docs-modal').classList.remove('hidden');
    }

    async function updateUserRole(userId) {
      const newRole = document.getElementById(`role-${userId}`).value;
      const { error } = await supabaseClient.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) showToast('Failed to update role.', 'error');
      else { showToast('Role updated successfully!', 'success'); loadAllUsers(); }
    }

    async function saveTutorSkills(userId) {
      const checkboxes = document.querySelectorAll(`.skill-chk-${userId}:checked`);
      const updatedSkills = Array.from(checkboxes).map(cb => cb.value);

      const { error } = await supabaseClient.from('profiles').update({ skills: updatedSkills }).eq('id', userId);
      if (error) showToast('Failed to update skills.', 'error');
      else showToast('Tutor skills successfully updated!', 'success');
    }

    async function deleteUser(userId) {
      if (!confirm("⚠️ WARNING: Are you sure you want to delete this user profile? This cannot be undone.")) return;

      const { error } = await supabaseClient.from('profiles').delete().eq('id', userId);
      if (error) showToast('Failed to delete user profile.', 'error');
      else { showToast('User profile deleted.', 'success'); loadAllUsers(); }
    }

    async function handleLogout() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
    
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `p-4 rounded-xl bg-[#112240] border ${type==='success'?'border-emerald-500/30 text-emerald-400':type==='error'?'border-rose-500/30 text-rose-400':'border-blue-500/30 text-blue-400'} text-xs font-medium shadow-2xl transition-all duration-300`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }
  </script>
</body>
</html>
